<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Speaker cabinet body with rounded corners -->
  <rect x="3" y="16" width="10" height="16" rx="2.5" fill="#1a1a1a"/>

  <!-- Grille lines on cabinet -->
  <line x1="5" y1="19.5" x2="11" y2="19.5" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <line x1="5" y1="22"   x2="11" y2="22"   stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <line x1="5" y1="24.5" x2="11" y2="24.5" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <line x1="5" y1="27"   x2="11" y2="27"   stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <line x1="5" y1="29.5" x2="11" y2="29.5" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

  <!-- Speaker cone (trapezoid from cabinet to horn) -->
  <path d="M13 16 L13 32 L27 38 L27 10 Z" fill="#1a1a1a"/>

  <!-- Horn flare edge highlight -->
  <line x1="27" y1="10" x2="27" y2="38" stroke="#555" stroke-width="1"/>

  <!-- Dust cap / speaker center circle -->
  <circle cx="27" cy="24" r="3.5" fill="white" opacity="0.15"/>
  <circle cx="27" cy="24" r="2"   fill="white" opacity="0.25"/>
  <circle cx="27" cy="24" r="0.8" fill="white" opacity="0.5"/>

  <!-- Suspension ring (surround) on cone -->
  <path d="M13 18 Q20 17 27 12" stroke="#555" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  <path d="M13 30 Q20 31 27 36" stroke="#555" stroke-width="0.8" fill="none" stroke-linecap="round"/>

  <!-- Sound wave 1 — small, closest -->
  <path d="M30 19.5 a6 6 0 0 1 0 9" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Sound wave 2 — medium -->
  <path d="M33.5 16.5 a9.5 9.5 0 0 1 0 15" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Sound wave 3 — large, farthest -->
  <path d="M37 13.5 a13 13 0 0 1 0 21" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Frequency dots between waves (detail) -->
  <circle cx="31.5" cy="24" r="0.9" fill="#1a1a1a"/>
  <circle cx="35"   cy="24" r="0.9" fill="#1a1a1a"/>
</svg>
