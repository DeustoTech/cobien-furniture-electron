<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Outer decorative orbit ring (dashed) -->
  <circle cx="24" cy="24" r="20" stroke="#1a1a1a" stroke-width="0.9" stroke-dasharray="3 2.5" fill="none" opacity="0.4"/>

  <!-- Long rays at cardinal directions (N,S,E,W) -->
  <line x1="24" y1="1.5"  x2="24" y2="9"   stroke="#1a1a1a" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="24" y1="39"   x2="24" y2="46.5" stroke="#1a1a1a" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="1.5"  y1="24" x2="9"   y2="24"  stroke="#1a1a1a" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="39"  y1="24"  x2="46.5" y2="24" stroke="#1a1a1a" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Short rays at diagonals (NE, NW, SE, SW) -->
  <!-- NE: cos45=sin45=0.707; start at r=10, end at r=16 -->
  <line x1="31.1" y1="16.9" x2="35.3" y2="12.7" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- NW -->
  <line x1="16.9" y1="16.9" x2="12.7" y2="12.7" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- SW -->
  <line x1="16.9" y1="31.1" x2="12.7" y2="35.3" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- SE -->
  <line x1="31.1" y1="31.1" x2="35.3" y2="35.3" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>

  <!-- Outer glow ring -->
  <circle cx="24" cy="24" r="9.5" fill="#222" stroke="#1a1a1a" stroke-width="1.2"/>

  <!-- Middle concentric ring (lens detail) -->
  <circle cx="24" cy="24" r="7"   fill="#333"/>

  <!-- Inner sun disk -->
  <circle cx="24" cy="24" r="5"   fill="#111"/>

  <!-- Specular highlight on sun face -->
  <circle cx="21.5" cy="21.5" r="1.5" fill="white" opacity="0.25"/>
  <circle cx="22"   cy="21"   r="0.6" fill="white" opacity="0.5"/>

  <!-- Graduated + / − symbols (brightness control hint) -->
  <!-- + sign top-right -->
  <line x1="38" y1="13" x2="43" y2="13" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="40.5" y1="10.5" x2="40.5" y2="15.5" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <!-- − sign bottom-right -->
  <line x1="38" y1="35" x2="43" y2="35" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
</svg>
